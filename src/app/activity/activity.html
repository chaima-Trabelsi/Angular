<div class="space-y-6 animate-in fade-in duration-500">
  <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
    <div class="p-6 border-b border-gray-50 dark:border-gray-700">
      <h3 class="text-lg font-bold text-gray-900 dark:text-white">Historique d'activité</h3>
    </div>
    
    <div class="divide-y divide-gray-50 dark:divide-gray-700">
      @for (item of activities(); track item.id) {
        <div class="p-6 flex gap-4">
          <div class="flex-shrink-0 w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center text-lg">
            {{ item.icon }}
          </div>
          <div>
            <p class="text-sm text-gray-900 dark:text-white font-medium">
              <span class="font-bold">{{ item.user }}</span> {{ item.action }}
            </p>
            <p class="text-xs text-gray-500 mt-1">{{ item.time }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
