<!-- app.component.html -->
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors flex flex-col">
  
  <app-nav-bar></app-nav-bar>

  <!-- Loader global pour les Resolvers -->
  @if (isRouting()) {
    <div class="fixed top-0 left-0 w-full h-1 z-[100] bg-blue-100 overflow-hidden">
      <div class="h-full bg-blue-600 animate-progress origin-left"></div>
    </div>
  }

  <!-- Bouton mode sombre flottant ou intégré (ici on le garde flottant mais discret) -->
  <div class="fixed bottom-6 right-6 z-50">
    <button
      (click)="toggleTheme()"
      class="p-4 rounded-full bg-white dark:bg-gray-800 shadow-xl border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 hover:scale-110 active:scale-95 transition-all"
      [title]="isDark ? 'Passer au mode clair' : 'Passer au mode sombre'"
    >
      {{ isDark ? '☀️' : '🌙' }}
    </button>
  </div>

  <!-- Contenu principal géré par le routeur -->
  <main class="flex-grow container mx-auto p-4 md:p-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer simple -->
  <footer class="py-6 text-center text-gray-500 dark:text-gray-400 text-sm border-t border-gray-100 dark:border-gray-800">
    &copy; 2024 Project Manager Pro - Expert Edition
  </footer>
</div>
