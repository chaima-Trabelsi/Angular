<!-- dashboard.component.html -->
<div class="space-y-8 animate-in fade-in duration-700">
  <div class="flex items-center justify-between">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">Tableau de bord</h1>
    <button (click)="loadStats()" class="p-2 text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/20 rounded-full transition" title="Rafraîchir">
      🔄
    </button>
  </div>

  @if (loading()) {
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      @for (i of [1,2,3]; track i) {
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-sm border border-gray-100 dark:border-gray-700 animate-pulse">
          <div class="h-10 w-20 bg-gray-200 dark:bg-gray-700 rounded mb-4"></div>
          <div class="h-4 w-32 bg-gray-100 dark:bg-gray-800 rounded"></div>
        </div>
      }
    </div>
  } @else if (error()) {
    <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 p-4 rounded-xl text-red-600 dark:text-red-400">
      {{ error() }}
    </div>
  } @else {
    <!-- Cartes statistiques -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Carte projets -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-8 hover:shadow-md transition-shadow">
        <div class="text-5xl font-extrabold text-blue-600 dark:text-blue-400 mb-2">{{ totalProjects() }}</div>
        <div class="text-gray-500 dark:text-gray-400 font-medium uppercase text-xs tracking-wider">Projets Actifs</div>
      </div>
      <!-- Carte tâches -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-8 hover:shadow-md transition-shadow">
        <div class="text-5xl font-extrabold text-indigo-600 dark:text-indigo-400 mb-2">{{ totalTasks() }}</div>
        <div class="text-gray-500 dark:text-gray-400 font-medium uppercase text-xs tracking-wider">Tâches Total</div>
      </div>
      <!-- Carte progression -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-8 hover:shadow-md transition-shadow">
        <div class="text-5xl font-extrabold text-emerald-600 dark:text-emerald-400 mb-2">{{ globalProgress() }}%</div>
        <div class="text-gray-500 dark:text-gray-400 font-medium uppercase text-xs tracking-wider">Avancement Global</div>
      </div>
    </div>

    <!-- Graphique circulaire central -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-12 flex flex-col items-center">
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-8">Performance du Portefeuille</h3>
      <div class="relative w-64 h-64">
        <svg class="w-full h-full transform -rotate-90">
          <circle cx="50%" cy="50%" r="42%" stroke="currentColor" stroke-width="12"
                  fill="none" class="text-gray-100 dark:text-gray-700" />
          <circle cx="50%" cy="50%" r="42%" stroke="currentColor" stroke-width="12"
                  fill="none" stroke-dasharray="264"
                  [attr.stroke-dashoffset]="264 - (264 * globalProgress()) / 100"
                  stroke-linecap="round"
                  class="text-emerald-500 transition-all duration-1000 ease-out" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="text-5xl font-black text-gray-900 dark:text-white">{{ globalProgress() }}%</span>
          <span class="text-xs text-gray-400 dark:text-gray-500 uppercase font-bold mt-1">Terminé</span>
        </div>
      </div>
    </div>
  }
</div>
